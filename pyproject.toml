[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "vocabulary-memory-sentences-skill"
version = "0.1.0"
description = "A bilingual Codex skill for audited vocabulary memory sentences and study-ready Word handouts."
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "zhongtw1979"}]
dependencies = ["python-docx>=1.1"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Education",
]

[project.optional-dependencies]
dev = ["pytest>=8", 'tomli>=2; python_version < "3.11"']

[tool.setuptools]
py-modules = []

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
